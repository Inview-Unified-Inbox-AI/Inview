name: Supabase - migrate Production

# SECURITY: the PR trigger is pull_request_target on purpose. GitHub then always runs THIS file
# as it exists on the production branch, so a pull request cannot edit the workflow to steal the
# production credentials. The PR's migration .sql files are copied in as plain data and are never run
# as code (see .github/actions/pr-migrations). Also restrict the "production" and "production"
# environments to the production branch only (Settings -> Environments -> Deployment branches).
# NOTE: this workflow must already exist on the production branch before it can run for a PR.
#
# Flow for a PR from main into production:
#   1. "Dry run"  runs by itself and only SHOWS what would change. Nothing is changed.
#   2. "Apply"    waits until the owner clicks Approve (GitHub Environment "production"),
#                 then pushes the migrations to the Production database.
#   3. The owner merges the PR only after "Apply" is green.
#      Merging deploys the code to Vercel Production, and the database is already ready for it.
# After the merge, "Verify" double-checks that Production has no waiting migrations.

on:
  pull_request_target:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry run on Production DB
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # "production" holds the same secrets as "production" but has no approval step.
    # It is safe only because this workflow always comes from the production branch.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - name: Load the PR's migration files (data only)
        if: github.event_name == 'pull_request_target'
        uses: ./.github/actions/pr-migrations
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied (changes nothing)
        run: supabase db push --remote --dry-run

  apply:
    name: Apply to Production DB
    # Runs after a successful dry run (PR), or on its own for a manual run.
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') ||
        (github.event_name == 'pull_request_target' && needs.dry-run.result == 'success')
      )
    needs: [dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The required reviewer on this environment is the approval gate.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - name: Load the PR's migration files (data only)
        if: github.event_name == 'pull_request_target'
        uses: ./.github/actions/pr-migrations
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations to Production
        run: supabase db push --remote

  verify:
    name: Verify Production is up to date
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Fail if any migration is still waiting
        run: |
          out="$(supabase db push --remote --dry-run 2>&1)"
          echo "$out"
          if echo "$out" | grep -qi "up to date"; then
            echo "Production database is up to date."
          else
            echo "::error::Production has migrations that were not applied before the merge. Run this workflow manually and approve it, then check the website."
            exit 1
          fi
